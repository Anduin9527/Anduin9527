name: Refresh contribution art

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=%23d59b49&color_dots=%23edf1f5,%23cce8de,%239bd3c1,%2364b99f,%23308d77
            assets/contributions-dark.svg?palette=github-dark&color_snake=%23e8b968&color_dots=%2318212e,%23244442,%23316458,%23478972,%237ad7b5
      - name: Save updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh contribution artwork'
          git pull --rebase origin main
          git push origin HEAD:main
